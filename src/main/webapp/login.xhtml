<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets">

<ui:composition template="/templates/layout.xhtml">
    <ui:define name="title">Login</ui:define>
    <ui:define name="content">

        <div class="auth-container">
            <div class="auth-card">
                <h2 class="auth-title">Login to Trousseau</h2>

                <h:form id="loginForm">
                    <p:messages id="messages" showDetail="true" closable="true" />

                    <div class="form-group">
                        <label for="username">Username</label>
                        <p:inputText id="username" value="#{loginBean.username}"
                                   required="true" requiredMessage="Username is required"
                                   placeholder="Enter your username"
                                   styleClass="form-input" />
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <p:password id="password" value="#{loginBean.password}"
                                  required="true" requiredMessage="Password is required"
                                  placeholder="Enter your password"
                                  toggleMask="true"
                                  styleClass="form-input" />
                    </div>

                    <div class="form-actions">
                        <p:commandButton value="Login" action="#{loginBean.login()}"
                                       ajax="false" styleClass="btn btn-primary btn-block"
                                       icon="pi pi-sign-in" />
                    </div>
                </h:form>

                <div class="auth-footer">
                    <p>
                        <h:link outcome="/forgot-password" styleClass="auth-link">
                            Forgot your password?
                        </h:link>
                    </p>
                    <p>Don't have an account?
                        <h:link outcome="/register" styleClass="auth-link">Register here</h:link>
                    </p>
                </div>
            </div>
        </div>

    </ui:define>
</ui:composition>
</html>
