# Trousseau + PostgreSQL. Copy .env.example to .env, set DB_PASSWORD, then:
#
#   docker compose up -d --build
#
# The app is then at http://localhost:8473/trousseau/ (or TROUSSEAU_PORT).
# All data, photos included, lives in the db-data volume. See docs/docker.md.

name: trousseau

services:
  app:
    build: .
    image: trousseau:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Host port deliberately not 8080, which many other servers already use.
    ports:
      - "${TROUSSEAU_PORT:-8473}:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-trousseau}
      DB_USER: ${DB_USER:-trousseau}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@trousseau.app}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-268435456}
      BEHIND_PROXY: ${BEHIND_PROXY:-false}
      TZ: ${TZ:-UTC}
      JBOSS_JAVA_SIZING: >-
        -Xms128m -Xmx${JAVA_MAX_HEAP:-1g}
        -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=256m
    # Lets WildFly finish in-flight requests and shut down cleanly.
    stop_grace_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-trousseau}
      POSTGRES_USER: ${DB_USER:-trousseau}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # Optional local mail catcher for trying the weekly email:
  #   docker compose --profile mailpit up -d   (with SMTP_HOST=mailpit, SMTP_PORT=1025)
  # Captured mail is shown at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    profiles: [mailpit]
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db-data:
