services:
  trousseau:
    image: ghcr.io/theophilustex/trousseau:latest
    pull_policy: always
    # To build locally from source instead of pulling pre-built image:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: trousseau
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - JWT_SECRET=change_me_to_a_random_secure_secret_string
    volumes:
      - ./data:/app/data
